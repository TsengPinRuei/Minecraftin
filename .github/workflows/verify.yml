name: Verify Minecraftin

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      graphics:
        description: Run the separate macOS ARM64 desktop OpenGL smoke test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Record exact source and runtime
        shell: bash
        run: |
          mkdir -p build/verification
          git rev-parse HEAD > build/verification/commit.txt
          java -version 2> build/verification/java.txt
          uname -sm > build/verification/platform.txt
          ./gradlew --version > build/verification/gradle.txt
          echo 'Desktop graphics are not run by this build job.' > build/verification/scope.txt
      - name: Test, build and verify application packages
        run: ./gradlew --no-daemon test build installDist verifyDistributionNotices
      - name: Preserve results for this commit and platform
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/verification/
            build/reports/
            build/test-results/
          retention-days: 30

  graphics:
    name: Optional macOS ARM64 desktop smoke
    if: github.event_name == 'workflow_dispatch' && inputs.graphics
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Exercise desktop OpenGL separately
        shell: bash
        run: |
          mkdir -p build/verification
          git rev-parse HEAD > build/verification/commit.txt
          java -version 2> build/verification/java.txt
          uname -sm > build/verification/platform.txt
          set -o pipefail
          ./gradlew --no-daemon graphicsSmokeTest 2>&1 | tee build/verification/graphics.txt
      - name: Preserve the actual graphics result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphics-${{ github.sha }}-macos-arm64
          path: |
            build/verification/
            build/reports/
          retention-days: 30
