plugins {
    id 'application'
}

group = 'com.minecraftin'
version = '0.1.0'

repositories {
    mavenCentral()
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nativePlatform = osName.startsWith('windows') ? 'windows' :
        osName.startsWith('mac') ? 'macos' : osName.startsWith('linux') ? 'linux' : null
def architecture = [
        amd64: 'x64', x86_64: 'x64',
        aarch64: 'arm64', arm64: 'arm64',
        x86: 'x86', i386: 'x86', i486: 'x86', i586: 'x86', i686: 'x86',
        arm: 'arm32', armv7: 'arm32', armv7l: 'arm32'
][arch]

// Match LWJGL native libraries to both the operating system and CPU architecture.
def lwjglNatives = [
        windows: [x64: 'natives-windows', x86: 'natives-windows-x86', arm64: 'natives-windows-arm64'],
        macos: [x64: 'natives-macos', arm64: 'natives-macos-arm64'],
        linux: [x64: 'natives-linux', arm64: 'natives-linux-arm64', arm32: 'natives-linux-arm32']
][nativePlatform]?.get(architecture)
if (lwjglNatives == null) {
    throw new GradleException("Unsupported platform: ${osName} / ${arch}")
}

ext {
    lwjglVersion = '3.3.3'
    jomlVersion = '1.10.5'
}

def defaultJvmArgs = ['-Xms1g', '-Xmx2g']
if (nativePlatform == 'macos') {
    // GLFW window creation on macOS must run on the first thread.
    defaultJvmArgs += '-XstartOnFirstThread'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    implementation "org.joml:joml:${jomlVersion}"

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.minecraftin.clone.MinecraftClone'
    applicationDefaultJvmArgs = defaultJvmArgs
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs += '-Xlint:all'
}

test {
    useJUnitPlatform()
}

// Run this desktop OpenGL 3.3 smoke test separately so headless builds do not require a display.
tasks.register('graphicsSmokeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.minecraftin.clone.render.GraphicsSmokeTest'
    if (nativePlatform == 'macos') {
        jvmArgs '-XstartOnFirstThread'
    }
}

// Keep third-party attribution beside the binaries in every application package.
distributions {
    main {
        contents {
            from('LICENSE', 'THIRD-PARTY-NOTICES.md')
            from('licenses') {
                into 'licenses'
            }
        }
    }
}

// Inspect the generated install tree and both archive formats, including contents.
tasks.register('verifyDistributionNotices') {
    group = 'verification'
    description = 'Verify that every application distribution includes complete license notices.'
    dependsOn installDist, distZip, distTar
    doLast {
        def expected = ['LICENSE', 'THIRD-PARTY-NOTICES.md',
                'licenses/lwjgl-LICENSE.md', 'licenses/libffi-LICENSE.txt',
                'licenses/liburing-LICENSE.txt', 'licenses/glfw-LICENSE.txt',
                'licenses/khronos-LICENSE.txt', 'licenses/joml-LICENSE.txt']
        expected.each { path ->
            if (!file(path).isFile() || file(path).length() == 0) {
                throw new GradleException("Missing source notice: ${path}")
            }
        }
        def installed = tasks.named('installDist').get().destinationDir
        expected.each { path ->
            def packaged = new File(installed, path)
            if (!packaged.isFile() || packaged.text != file(path).text) {
                throw new GradleException("Missing or changed installDist notice: ${path}")
            }
        }
        [zipTree(tasks.named('distZip').get().archiveFile),
         tarTree(tasks.named('distTar').get().archiveFile)].each { archive ->
            expected.each { path ->
                def entries = archive.matching { include "*/${path}" }.files
                if (entries.size() != 1 || entries.first().text != file(path).text) {
                    throw new GradleException("Missing or changed archive notice: ${path}")
                }
            }
        }
    }
}

// Measure retained data and save latency along an isolated, bounded 8,064-block route.
tasks.register('resourceBudgetProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.minecraftin.clone.game.ResourceBudgetProbe'
    maxHeapSize = '2g'
}
